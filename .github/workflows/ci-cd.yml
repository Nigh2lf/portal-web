name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# contents: read for the checkout; id-token: write so the deploy job can assume the AWS role by OIDC.
permissions:
  contents: read
  id-token: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  quality:
    name: Lint, typecheck and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: ESLint
        run: npm run lint

      - name: Generate Next route types
        run: npx next typegen

      - name: TypeScript
        run: npx tsc --noEmit

      - name: Next build
        run: npm run build

  deploy:
    name: Deploy to EC2 (Systems Manager)
    needs: quality
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment: production
    env:
      EC2_INSTANCE_ID: ${{ vars.EC2_INSTANCE_ID }}
      APP_DIR: /var/www/portal-web
    steps:
      - uses: actions/checkout@v4

      - name: Check repository variables
        env:
          AWS_ROLE_ARN: ${{ vars.AWS_ROLE_ARN }}
          AWS_REGION: ${{ vars.AWS_REGION }}
        run: |
          for name in AWS_ROLE_ARN AWS_REGION EC2_INSTANCE_ID; do
            if [[ -z "${!name}" ]]; then
              echo "::error::Repository variable $name is not set (Settings > Secrets and variables > Actions > Variables). See ci-cd/README.md in the workspace."
              exit 1
            fi
          done

      # The runner assumes the AWS role through OIDC: no AWS key stored in the repository.
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Deploy through Systems Manager
        run: |
          # SSM runs as root on the server; every command below runs as ubuntu so the
          # checkout keeps its owner. The checkout is updated before scripts/deploy.sh runs.
          bash scripts/ssm-run.sh "deploy portal-web ${GITHUB_SHA::7}" <<EOF
          set -euo pipefail
          cd "$APP_DIR"
          if [ -n "\$(sudo -u ubuntu -H git status --porcelain)" ]; then
            echo "The server checkout has local changes; refusing to overwrite them:" >&2
            sudo -u ubuntu -H git status --short >&2
            exit 1
          fi
          sudo -u ubuntu -H git fetch --prune origin
          sudo -u ubuntu -H git checkout -q main
          sudo -u ubuntu -H git reset -q --hard "$GITHUB_SHA"
          sudo -u ubuntu -H env bash scripts/deploy.sh "$GITHUB_SHA"
          EOF
