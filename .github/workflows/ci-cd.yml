name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  quality:
    name: Lint, typecheck and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: ESLint
        run: npm run lint

      - name: Generate Next route types
        run: npx next typegen

      - name: TypeScript
        run: npx tsc --noEmit

      - name: Next build
        run: npm run build

  deploy:
    name: Deploy to EC2
    needs: quality
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    env:
      AWS_SECURITY_GROUP_ID: ${{ secrets.AWS_SECURITY_GROUP_ID }}
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_DEPLOY_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_DEPLOY_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: ${{ secrets.AWS_REGION || 'us-east-1' }}
    steps:
      - name: Check deploy secrets
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
        run: |
          if [[ -z "$EC2_HOST" || -z "$EC2_SSH_KEY" ]]; then
            echo "::error::EC2_HOST and EC2_SSH_KEY secrets are not set. Run ci-cd/set-github-secrets.sh (see ci-cd/README.md in the workspace)."
            exit 1
          fi

      - name: Runner public IP
        id: ip
        run: echo "ip=$(curl -fsS https://checkip.amazonaws.com)" >> "$GITHUB_OUTPUT"

      - name: Allow runner IP on port 22 (only when AWS_SECURITY_GROUP_ID is set)
        if: env.AWS_SECURITY_GROUP_ID != ''
        run: |
          aws ec2 authorize-security-group-ingress --group-id "$AWS_SECURITY_GROUP_ID" \
            --protocol tcp --port 22 --cidr "${{ steps.ip.outputs.ip }}/32"
          sleep 5

      - name: Prepare SSH key
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.EC2_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "${{ secrets.EC2_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Pull and deploy on the server
        run: |
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes -o ConnectTimeout=30 \
            "${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}" \
            "cd /var/www/portal-web && git fetch origin main && git checkout -q main && git pull --ff-only origin main \
             && bash scripts/deploy.sh '${{ github.sha }}'"

      - name: Revoke runner IP on port 22
        if: always() && env.AWS_SECURITY_GROUP_ID != ''
        run: |
          aws ec2 revoke-security-group-ingress --group-id "$AWS_SECURITY_GROUP_ID" \
            --protocol tcp --port 22 --cidr "${{ steps.ip.outputs.ip }}/32" || true
